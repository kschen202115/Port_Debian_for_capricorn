# USB gadget serial（/dev/ttyGS0）自动登录。
#
# 取代原来的 auto_ttyGS0.sh + autottyGS0.service。那套有三处硬伤：
#   1. 脚本结尾 `exec setsid login -f ... <> /dev/ttyGS0 >&0 2>&1`。systemd 已把
#      service 主进程设为 session leader，util-linux 的 setsid 在这种情况下会
#      fork 并让父进程立即退出 → systemd 认为服务结束 → Restart=always 每 5 秒
#      再起一个 login，和前一个抢同一个串口，输入错乱且实例越堆越多。
#   2. setsid 不带 -c/--ctty 不做 TIOCSCTTY，那个 tty 不是控制终端，
#      job control 失效，Ctrl-C / Ctrl-Z 都没用。
#   3. 不设 CLOCAL 时，主机未连接（无 carrier）的 open() 可能阻塞。
#
# serial-getty@.service 模板自带 BindsTo=dev-%i.device：udev 发现设备才启动、
# 设备消失就停止，正好替掉脚本里那个 `while [ ! -c ... ]; sleep 5` 轮询。
# agetty 则会正确处理 TIOCSCTTY、termios、hangup、utmp —— 这些 login -f 都不做。
[Service]
# 先清空模板的 ExecStart，否则 systemd 会报「只能有一个 ExecStart」
ExecStart=
# --local-line 即 agetty 的 -L：设 CLOCAL，不等载波信号。
#   USB CDC-ACM 其实不关心波特率，--keep-baud 只是为了兼容真串口调试。
# 开头的 - 表示忽略退出码，模板本来就有，保留。
ExecStart=-/sbin/agetty --autologin kschen --local-line --keep-baud 115200,57600,38400,9600 %I $TERM
