# USB gadget serial（/dev/ttyGS0）自动登录。
#

[Unit]
# 只有 /run/usbconsole.enable 存在时才允许启动（由 usbconsole 脚本创建）。
#
# 原因：systemd 257 回归 upstream #37854 —— systemd-executor 给服务设置 TTY 时
# 会对 /dev/console 加排他 flock，而为 ttyGS0 建立 stdin 时若没有 USB 主机连接
# 就会一直阻塞，锁不释放，导致 getty@tty1 乃至 PID 1 全部死等，屏幕上没有 shell。
#
# 修好 USB（DT 加 qcom,tcsr-syscon）之后 dwc3 开机就能 probe，g_serial gadget
# 起来、/dev/ttyGS0 出现，这个 unit 才第一次真正跑起来并暴露了该 bug。
ConditionPathExists=/run/usbconsole.enable

[Service]
# 先清空模板的 ExecStart，否则 systemd 会报「只能有一个 ExecStart」
ExecStart=
# --local-line 即 agetty 的 -L：设 CLOCAL，不等载波信号。
#   USB CDC-ACM 其实不关心波特率，--keep-baud 只是为了兼容真串口调试。
# 开头的 - 表示忽略退出码，模板本来就有，保留。
ExecStart=-/sbin/agetty --autologin kschen --local-line --keep-baud 115200,57600,38400,9600 %I $TERM
