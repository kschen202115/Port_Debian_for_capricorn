[[events]]
# 事件名（可选）
name = "kb"
event_type = "EV_KEY"
# 只对 EV_KEY 有效：命令在按下还是松开时触发
key_state = "released"
keys = ["KEY_VOLUMEDOWN"]
command = "/usr/bin/power.sh kb"

[[events]]
name = "power"
event_type = "EV_KEY"
# 松开电源键 -> 切换屏幕亮度。
# 长按关机由 logind 处理（见 /etc/systemd/logind.conf.d/10-powerkey.conf
# 里的 HandlePowerKeyLongPress=poweroff），两者不冲突：evdev 允许多个读者。
key_state = "released"
keys = ["KEY_POWER"]
command = "/usr/bin/power.sh power"
